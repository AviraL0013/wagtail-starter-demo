name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    name: Lint (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install ruff
      - run: ruff check . --output-format=github

  test:
    name: "Test · Py${{ matrix.python }} / Django${{ matrix.django }} / Wagtail${{ matrix.wagtail }}"
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - python: "3.12"
            django: "5.2"
            wagtail: "7.0"
          - python: "3.11"
            django: "5.2"
            wagtail: "7.0"
          - python: "3.12"
            django: "5.1"
            wagtail: "6.4"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python }}
      - run: pip install "django~=${{ matrix.django }}" "wagtail~=${{ matrix.wagtail }}" -r requirements.txt
      - run: python manage.py migrate --noinput
      - run: python manage.py test --verbosity=2

  frontend:
    name: Frontend build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm ci
      - run: npm run build:prod